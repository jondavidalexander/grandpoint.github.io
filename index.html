<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Portfolio Template</title>
  <meta name="description" content="A colorful abstract artist portfolio template with individual artwork inquiry pages." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="paint-blob blob-one"></div>
  <div class="paint-blob blob-two"></div>
  <div class="paint-blob blob-three"></div>

  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Back to gallery">
      <span class="logo-mark"></span>
      <span class="logo-text">Artist Name</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Gallery</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="app">
    <!-- JavaScript will render the gallery or the individual artwork page here. -->
  </main>

  <footer class="site-footer" id="contact">
    <div>
      <h2>Interested in a piece?</h2>
      <p>Email <a href="mailto:artist@example.com">artist@example.com</a> or use the inquiry button on each artwork page.</p>
    </div>
    <p class="small">© <span id="year"></span> Artist Name. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
